[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stlfrc"
version = "0.1.0"
description = "Automated scanner monitoring and GroupMe alerts for the fire canteen"
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stlfrc = "stlfrc.cli:main"

[tool.setuptools]
packages = ["stlfrc"]
